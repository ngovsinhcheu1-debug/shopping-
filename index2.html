<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Roboto Condensed", sans-serif;
    }
    .nav{
        width: 100%;
        height: 90px;
        box-shadow: 0 0 25px black;
        display: flex;
    }
    .loggo{
        width: 40%;
        height: 100%;
        display: flex;
        padding-left: 120px;
        align-items: center;
        gap: 10px;
    }
    .loggo .img{
        width: 70px;
        height: 70px;
        background: #000;
    }
    .loggo .name-company{
        width: 250px;
        height: 70px;
    }
    .name-company p{
        font-size: 14px;
        margin-top:2px;
        color:rgb(15, 15, 170) ;
    }
    span{
        font-size: 14px;
        margin-top:2px;
        color:rgb(15, 15, 170) ;
        font-weight: 700;
    }
    .menu{
        width: 60%;
        height: 100%;
    }
    .menu .flag{
        width: 100%;
        height: 50%;
        display: flex;
        justify-content: end;
        align-items: center;
        gap: 5px;
        padding-right:140px;
    }
    .menu .content{
        width: 100%;
        height: 50%;
    }
    .flag1{
        width: 35px;
        height: 25px;
        background-color: antiquewhite;
    }
    img{
        width: 100%;
        height: 100%;
    }
    ul{
        display: flex;
        height: 100%;
        gap: 30px;
        align-items: center;
        justify-content: end;
        padding-right: 140px;
    }
    li{
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
    }
    button{
        width: 130px;
        height: 35px;
        font-size: 12px;
        border: none;
        border-radius:5px;
        border: 1px solid rgb(151, 147, 147);
        box-shadow: 0 0 8px rgb(202, 201, 201);
        background-color: rgb(250, 251, 252);
        cursor: pointer;
    }
    i{
        font-size: 10px;
    }
</style>
<body>
    <header>
        <div class="nav">
            <div class="loggo">
                <div class="img">
                    <img src="../Photo/leapsloy.jpg" alt="">
                </div>
                <div class="name-company">
                    <p>មន្ទីពេទ្យព្យាបាលធ្មេញ​ រៀលធីស</p>
                    <span>We specilized in smiles</span>
                </div>
            </div>
            <div class="menu">
                <div class="flag">
                    <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/Flag_of_the_United_Kingdom_%281-2%29.svg/1280px-Flag_of_the_United_Kingdom_%281-2%29.svg.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=thumbnail" alt="" class="flag1">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Flag_of_Cambodia.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="" class="flag1">
                    <img src="https://cdn.britannica.com/90/7490-050-5D33348F/Flag-China.jpg" alt="" class="flag1">
                </div>
                <div class="content">
                    <ul>
                        <li>Home</li>
                        <li>About Us <i class="fa-solid fa-chevron-down"></i></li>
                        <li>Services <i class="fa-solid fa-chevron-down"></i></li>
                        <li>Technology <i class="fa-solid fa-chevron-down"></i></li>
                        <li>Q&A</li>
                        <li>Contact Us</li>
                        <button>Book Appointment</button>
                    </ul>
    </div>
            </div>
        </div>  
    </header>
</body>
</html>
